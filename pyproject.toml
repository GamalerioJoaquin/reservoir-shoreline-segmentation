[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-shoreline-segmentation"
version = "0.1.0"
description = "Reusable utilities and notebooks for reservoir shoreline segmentation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Joaquin Gamalerio" }]
dependencies = [
    "matplotlib>=3.8",
    "imagecodecs>=2024.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "rasterio>=1.3",
    "scikit-image>=0.22",
    "scipy>=1.10",
    "tifffile>=2023.7",
]

[project.optional-dependencies]
notebooks = [
    "gdown>=5.2",
    "ipykernel>=6.25",
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
    "notebook>=7.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
